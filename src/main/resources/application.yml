server:
  port: 8080
management:
  endpoints:
    web:
      exposure:
        include: health,metrics
spring:
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB
persistence:
  type: file
  directory: ./job-data
  bucket: ""
  endpoint: ""
  region: ""
  access-key: ""
  secret-key: ""
webhook:
  timeout: 5s
  max-registrations: 1000
  delivery-threads: 2
  allowed-hosts: []
app:
  api-key: ${APP_API_KEY:dev-key}
batch:
  max-prompts: 10000
  chunk-size: 25
  worker-threads: 4
  ingestion-threads: 2
  queue-capacity: 32
  max-in-flight-per-job: 4
  max-jobs: 1000
  high-throughput-prompt-threshold: 1000
  high-throughput-route: cheap
  input-directory: ./workspace-input
inference:
  endpoint: ""
  timeout: 10s
  max-retries: 3
  initial-backoff: 100ms
  max-backoff: 2s
  default-route: cheap
  routes:
    - name: cheap
      endpoint: ""
      cost-per-request: 0.001
    - name: premium
      endpoint: ""
      cost-per-request: 0.02
