server:
  port: 8080
management:
  endpoints:
    web:
      exposure:
        include: health,metrics
spring:
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB
batch:
  max-prompts: 10000
  chunk-size: 25
  worker-threads: 4
  ingestion-threads: 2
  queue-capacity: 32
  max-jobs: 1000
  high-throughput-prompt-threshold: 1000
  high-throughput-route: cheap
  input-directory: ./workspace-input
inference:
  endpoint: ""
  timeout: 10s
  max-retries: 3
  initial-backoff: 100ms
  max-backoff: 2s
  default-route: premium
  routes:
    - name: cheap
      endpoint: ""
      cost-per-request: 0.001
    - name: premium
      endpoint: ""
      cost-per-request: 0.02
